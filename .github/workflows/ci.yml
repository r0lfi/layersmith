name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'

      # The suite uses a fake build backend, so it needs no container runtime.
      # The real-runtime smoke test is opt-in and skipped here.
      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # tsc runs as part of the build script, so type errors fail here.
      - name: Build
        working-directory: frontend
        run: npm run build

  smoke:
    name: Real build against Podman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'

      # Fail loudly rather than letting the test skip itself into a green
      # check if the runner image ever drops podman.
      - name: Check podman is present
        run: podman --version

      # Builds a real Alpine image, runs it to confirm the packages are
      # present, exports it and loads the archive back.
      - name: Smoke test
        working-directory: backend
        env:
          LAYERSMITH_SMOKE: "1"
        run: pytest tests/test_runtime_smoke.py -v
