# LayerSmith - self-hosted container image builder.
#
#   docker compose up -d      (or: podman compose up -d)
#   open http://localhost:8080
#
# LayerSmith serves the web application; the images your users build are made
# by a container runtime on the host, reached through the socket mounted
# below. That socket is powerful: anything able to use it can run containers
# as its owner. LayerSmith has no authentication in 0.1.x, so keep it on a
# trusted network or put an authenticating proxy in front of it.
# See docs/deployment.md for the alternatives, including a separate build host.

services:
  layersmith:
    image: ghcr.io/r0lfi/layersmith:latest
    # Pin a release in production, for example:
    #   image: ghcr.io/r0lfi/layersmith:0.2.0
    container_name: layersmith
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      LAYERSMITH_DATA_DIR: /data
      # "docker" drives a Docker socket and equally a rootless Podman socket,
      # which speaks the same API. "podman" requires a podman client in the
      # image and is meant for running LayerSmith directly on a host instead.
      LAYERSMITH_BUILD_BACKEND: docker
      DOCKER_HOST: unix:///var/run/docker.sock

      # ---- image scanning (optional) -------------------------------------
      # Off until the scanner image is present on the host:
      #   docker pull ghcr.io/aquasecurity/trivy:0.74.0
      # LayerSmith then scans each finished image and reports what it found;
      # it never blocks a build. The scanner runs in its own container with
      # no socket, no added capabilities and one read-only mount.
      #
      # LAYERSMITH_SCANNER: auto
      # LAYERSMITH_SCANNER_RUNTIME: docker
      # The scanner runs as a sibling container, so it cannot see this
      # container's /data; naming the volume lets it reach the archive being
      # scanned. Compose prefixes volume names with the project, so check
      # `docker volume ls` and use the name it shows - usually:
      # LAYERSMITH_SCANNER_DATA_VOLUME: layersmith_layersmith-data

    volumes:
      # Everything LayerSmith keeps - database, images, builds, uploads, logs.
      - layersmith-data:/data
      # Docker host: the daemon socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # Rootless Podman host: comment out the line above and use this instead,
      # after `systemctl --user enable --now podman.socket`:
      # - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  layersmith-data:
# The scanner keeps its vulnerability database in a volume of its own, which
# the runtime creates on the first scan; it is not declared here because the
# scanner container is started per scan rather than by compose.
