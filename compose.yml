# LayerSmith - single service, one volume.
#
# Building images needs a container runtime. The default setup talks to a
# Podman socket on the host, which keeps the build outside this container
# instead of granting it privileged access. See docs/deployment.md for the
# alternatives, including a separate build host.
services:
  layersmith:
    image: ghcr.io/example/layersmith:latest
    container_name: layersmith
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LAYERSMITH_DATA_DIR: /data
      # The image ships the Docker CLI; Podman's socket speaks the same API,
      # so this works for both. Swap the mount below for Docker's socket to
      # build with Docker instead.
      LAYERSMITH_BUILD_BACKEND: docker
      DOCKER_HOST: unix:///run/podman/podman.sock
    volumes:
      - layersmith-data:/data
      # Rootless Podman socket from the host (systemctl --user start podman.socket):
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock

volumes:
  layersmith-data:
