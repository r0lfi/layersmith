[project]
name = "layersmith-client"
dynamic = ["version"]
description = "Terminal client (CLI and TUI) for a LayerSmith server."
readme = "README.md"
# 3.9 so the stock python3 of an Enterprise Linux 9 jumphost is enough.
requires-python = ">=3.9"
license = { text = "MIT" }
# Client dependencies only: no server, database or container tooling. Every
# one of them, and everything they pull in, is a pure-Python wheel, which is
# what lets one offline wheelhouse serve every platform.
dependencies = [
    "httpx>=0.27,<1.0",
    "textual>=8.0,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
layersmith = "layersmith_client.cli:main"

[project.urls]
Source = "https://github.com/r0lfi/layersmith"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "layersmith_client._version.__version__" }

[tool.setuptools.packages.find]
include = ["layersmith_client*"]

[tool.setuptools.package-data]
"layersmith_client.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
