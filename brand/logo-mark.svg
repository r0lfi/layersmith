<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LayerSmith">
  <title>LayerSmith</title>
  <defs>
    <linearGradient id="ls-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ls-mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="ls-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>

  <!-- Three isometric layers. The middle one is drawn as an anvil: a body
       that tapers to a horn on the left, so the stack reads as layers and as
       a smith's anvil depending on how you look at it. -->
  <path d="M32 6 58 19 32 32 6 19Z" fill="url(#ls-top)"/>
  <path d="M6 26 32 39 58 26 58 30 32 43 6 30Z" fill="url(#ls-mid)"/>
  <path d="M6 37 32 50 58 37 58 41 32 54 6 41Z" fill="url(#ls-base)"/>

  <!-- Spark: the smith half of the name, struck off the top layer. -->
  <path d="M44 9.5 46.6 14.3 51.4 11.7 48.8 16.5 53.6 19.1 48.2 19.1 48.2 24 45.6 19.2 40.8 21.8 43.4 17 38.6 14.4 44 14.4Z"
        fill="#e0f2fe" opacity="0.9"/>
</svg>
